<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title th:text="${title}">Happy Stuff</title>
</head>
<body style="background-color: #f4f4f4; font-family: Arial, sans-serif;">
  
  <table role="presentation" width="100%" style="background-color: #f4f4f4;">
    <tr>
      <td align="center" style="padding: 20px 0;">
        <table role="presentation" width="100%" style="max-width: 600px;">
          
          <tr>
            <td align="center" style="padding-bottom: 20px;">
              <h1 style="color: #333; margin: 0;" th:text="${title}">Title Placeholder</h1>
              <p style="color: #666; margin: 5px 0 0 0;">From: <span th:text="${fromName}">Sender</span></p>
            </td>
          </tr>

          <tr th:each="card : ${cards}">
            <td align="center" style="padding-bottom: 20px;">
              <table role="presentation" width="90%" style="background-color: #fff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1);">
                <tr>
                  <td align="center" style="padding: 0;">
                    <img th:src="${card.imageUrl}" alt="Gif" style="width: 100%; display: block;">
                  </td>
                </tr>
                <tr>
                  <td align="center" style="padding: 20px;">
                    <p style="font-size: 18px; color: #333;" th:text="${card.text}">Message text</p>
                  </td>
                </tr>
              </table>
            </td>
          </tr>

        </table>
      </td>
    </tr>
  </table>

</body>
</html>
